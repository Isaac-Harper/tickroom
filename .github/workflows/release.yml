# Publishing a release, without a long-lived token anywhere.
#
# WHICH TIER THIS RUNS, AND WHY: `integration`, never `measure`. The gate is
# build, typecheck and `npm run test:integration`, which is the unit tier plus
# the real-Redis files whose outcome the code decides. The measurement tier is
# deliberately NOT here. It used to be, via `npm test`, and it cost two release
# runs: v0.3.0 failed twice on two different timing bounds on a shared GitHub
# runner while the same commit was green locally both times. A publish blocked
# by a noisy runner is a publish blocked by nothing, and the temptation it
# creates is to loosen the bound, which throws away the measurement to save the
# release. So the measurement tier runs in `nightly.yml` and on a quiet machine
# (`npm run test:measure`), and the gate that decides whether a version number
# is burned forever is the deterministic half. The few wall-clock cases still
# inside `ticker.redis.test.ts` and `faults.redis.test.ts` are gated on
# `TOO_JITTERY` in the file, so they skip loudly here rather than redden.
#
# WHY THIS EXISTS. The first publish was done by hand and it was not pleasant:
# npm now requires two-factor auth to publish, the account had none, and the
# fallback (a granular token) has its own trap for a package that does not exist
# yet, since a token scoped to specific packages cannot CREATE one. That is all
# first-publish-only pain, but the token half is not: a stored NPM_TOKEN with
# publish rights is a standing credential, and a stolen one publishes on its own
# whereas 2FA does not. npm is actively restricting 2FA-bypass tokens for exactly
# this reason.
#
# So this uses TRUSTED PUBLISHING (OIDC): npm verifies the workflow's identity
# against GitHub directly and mints a short-lived credential for that one run.
# Nothing to store, nothing to leak, nothing to rotate. It also stamps the
# package with PROVENANCE, so the npm page can show which commit and workflow
# built it.
#
# ONE-TIME SETUP, on npmjs.com, otherwise this fails with a 404 or 403:
#   Package tickroom -> Settings -> Trusted publishing -> Add GitHub Actions
#     repository:  Isaac-Harper/tickroom
#     workflow:    release.yml
# It cannot be configured before the package exists, which is why 0.1.0 was
# published manually.
#
# TO RELEASE: bump the version in package.json, commit, then tag and push:
#   npm version patch -m "release %s"   (or minor/major)
#   git push --follow-tags
# The tag is what triggers this. The guard below refuses a tag that disagrees
# with package.json, because a mismatch publishes a version nobody meant to.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for OIDC; without it npm cannot verify the runner

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # THE SAME REDIS SERVICE CI USES, AND THE SAME REQUIRE FLAG. Without them
    # the test step below still passes: the real-Redis files skip cleanly when
    # nothing listens on 6399, exit 0, and the release is the one build in which
    # the lease, the checkpoint, the handoff, the subscriber and the
    # fault-injection suites ran zero assertions. A gate that cannot fail is
    # worse than no gate, and this is the gate whose version number is burned
    # forever.
    services:
      redis:
        image: redis:8
        ports:
          - 6399:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # NO `registry-url` HERE, ON PURPOSE. With it, setup-node writes an
      # `_authToken=${NODE_AUTH_TOKEN}` line into the runner's npmrc and fills
      # the variable with a placeholder when no secret is provided, and the
      # first run of this workflow (v0.2.0, 2026-09-05) then had npm answer the
      # PUT with a 404 instead of minting an OIDC credential. Trusted publishing
      # needs exactly one auth path: the id-token. If the next tag still fails
      # with a 404, the missing half is the npmjs.com side (the one-time setup
      # above), not this file. 0.2.0 was published from a laptop session after
      # that failure, so it carries no provenance.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm 11.5.1+ is required for trusted publishing. ubuntu-latest ships an
      # older npm with Node 22, so pin it explicitly rather than hoping.
      - run: npm install -g npm@latest

      - run: npm ci

      # The gates, same as CI. A release must never be the one build nobody
      # checked: a broken publish cannot be un-published and its version number
      # is burned forever.
      - run: npm run build
      - run: npm run typecheck
      - name: integration tier, Redis required
        env:
          TICKROOM_TEST_REDIS_URL: redis://127.0.0.1:6399
          # The `test:integration` script sets this too; repeated here so the
          # release file states the requirement itself rather than inheriting it
          # from a script somebody could edit. See tests/helpers/env.ts.
          TICKROOM_REQUIRE_REDIS: '1'
        run: npm run test:integration

      # The tag and package.json must agree. Without this, `git tag v0.2.0` on a
      # tree still saying 0.1.9 silently republishes nothing useful, or fails
      # deep inside npm with a confusing error.
      - name: tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME implies $TAG but package.json says $PKG"
            exit 1
          fi
          echo "releasing $PKG"

      - run: npm publish --access public --provenance
